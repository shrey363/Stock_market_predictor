# Example configuration for Phase 1 (define and inspect data).
#
# Copy to configs/config.yaml and edit. Nothing here is a secret; data files are
# downloaded into data/raw/ (git-ignored) and are never committed.
#
# Every timestamp handled by this project is normalised to UTC. The market series
# uses one daily bar per exchange session; the news series carries a day-level
# publication date only (see docs/dataset_notes.md).

project:
  name: geopolitical-stock-predictor
  random_seed: 42

data:
  market:
    # One broad index proxy first ("small and correct first"). Expand later, if at all.
    symbol: SPY
    start: "2018-01-01"
    end: "2022-12-31"
    interval: "1d"
    timezone: "UTC"
    source: "Yahoo Finance via yfinance (research/educational use; see docs/dataset_notes.md)"

  news:
    # Hugging Face mirror of the Kaggle "News Category Dataset" (HuffPost headlines).
    # Licence: CC BY 4.0 — attribution required. Revision pins the exact snapshot.
    dataset_id: "heegyu/news-category-dataset"
    revision: "304a05a55bc6abc0446d8fae0d0771716b6a271a"
    source_file: "data.json"
    license: "CC BY 4.0"
    license_url: "https://creativecommons.org/licenses/by/4.0/"
    dataset_url: "https://huggingface.co/datasets/heegyu/news-category-dataset"
    # The source's own "category" column is NOT our event taxonomy; we filter on it
    # only to keep the first dataset small.
    source_category_filter: "POLITICS"
    start: "2018-01-01"
    end: "2022-12-31"
    max_articles: 12000
    # The source provides a calendar date, not a publication time.
    timestamp_precision: "day"

nlp:
  # Phase 2: transparent keyword/rule-based event classification plus a lexicon sentiment
  # baseline. Both are intentionally simple and auditable; a pretrained model is an optional
  # later step, not a default dependency.
  # "headline" classifies the headline only (documented Phase 2 limitation);
  # "headline+description" also uses the source's short description.
  text_scope: "headline"
  taxonomy_version: "1.1"
  sentiment_mode: "lexicon"
  # Size and seed of the deterministic, stratified review sheet the team labels by hand.
  review_sample_size: 200
  review_sample_seed: 42

features:
  # Phase 3 market-only features. Each is evaluated at the close of its bar and then
  # shifted forward one row, so a row for session t uses bars up to and including t-1
  # only (docs/ARCHITECTURE.md §3, invariant 2). Warm-up rows are dropped, never filled.
  return_windows: [1, 5, 20]
  moving_average_windows: [10, 50]
  rsi_window: 14
  volatility_window: 20
  volume_window: 20
  # Phase 4: per-session news features aggregate articles whose available_from
  # falls in (news_cutoff - lookback_days, news_cutoff]. Sessions with no article
  # in that window get zero counts plus no_news=1; nothing is imputed.
  news_lookback_days: 7

splits:
  # Chronological cut of the feature rows; the test period is the remainder and is
  # evaluated once, after model selection. Rows are never shuffled.
  train_fraction: 0.70
  validation_fraction: 0.15

model:
  # One model family for the baseline; Phase 4 reuses it with news features added so
  # the market-only and market+news runs stay comparable.
  type: "logistic_regression"
  c_values: [0.01, 0.1, 1.0, 10.0]
  max_iter: 2000
  selection_metric: "balanced_accuracy"

prediction:
  # Everything in a feature row must be strictly earlier than this cutoff on the
  # prediction day; day-precision news is therefore usable from the next day onward.
  cutoff_time: "00:00"
  target: "next_session_return_positive"

trading:
  # Used from Phase 5 onward. Simulated only — no live or real-money trading.
  initial_capital: 100000.0
  transaction_cost_bps: 10.0
  position_fraction: 1.0

rl:
  # Used from Phase 6 onward. Agents are trained only on the train/validation
  # periods and evaluated once on the held-out test period, per seed.
  total_timesteps: 50000
  seeds: [0, 1, 2]
